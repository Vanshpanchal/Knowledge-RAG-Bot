name: CI - Tests and Linting

on:
          push:
                    branches:
                              - main
                              - develop
          pull_request:
                    branches:
                              - main
                              - develop
          workflow_dispatch:

jobs:
          test:
                    runs-on: ubuntu-latest
                    strategy:
                              matrix:
                                        python-version: ["3.11", "3.12"]

                    services:
                              mongodb:
                                        image: mongo:7.0
                                        ports:
                                                  - 27017:27017
                                        options: >-
                                                  --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
                                                  --health-interval 10s
                                                  --health-timeout 5s
                                                  --health-retries 5

                    steps:
                              - name: Checkout
                                uses: actions/checkout@v4

                              - name: Setup Python
                                uses: actions/setup-python@v5
                                with:
                                          python-version: ${{ matrix.python-version }}
                                          cache: pip

                              - name: Install dependencies
                                run: |
                                          python -m pip install --upgrade pip
                                          pip install -r requirements.txt
                                          pip install pytest pytest-cov pytest-asyncio black pylint mypy bandit

                              - name: Check formatting
                                run: black --check app bot.py

                              - name: Lint
                                run: pylint app bot.py

                              - name: Type check
                                run: mypy app bot.py --ignore-missing-imports

                              - name: Run tests
                                env:
                                          MONGODB_URI: mongodb://localhost:27017
                                          DATABASE_NAME: knowledge_rag_test
                                run: pytest test_*.py -v --tb=short --cov=app --cov-report=term-missing --cov-report=xml

                              - name: Security scan
                                run: bandit -r app bot.py
