name: Docker Build and Publish

on:
          push:
                    branches:
                              - main
                    tags:
                              - "v*"
          pull_request:
                    branches:
                              - main
          workflow_dispatch:

env:
          GHCR_REGISTRY: ghcr.io
          GHCR_IMAGE: ${{ github.repository }}
          DOCKERHUB_IMAGE: YOUR_DOCKERHUB_USERNAME/knowledge-rag-bot

jobs:
          docker:
                    runs-on: ubuntu-latest
                    permissions:
                              contents: read
                              packages: write

                    steps:
                              - name: Checkout
                                uses: actions/checkout@v4

                              - name: Setup Buildx
                                uses: docker/setup-buildx-action@v3

                              - name: Login GHCR
                                if: github.event_name != 'pull_request'
                                uses: docker/login-action@v3
                                with:
                                          registry: ${{ env.GHCR_REGISTRY }}
                                          username: ${{ github.actor }}
                                          password: ${{ secrets.GITHUB_TOKEN }}

                              - name: Login Docker Hub
                                if: github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
                                uses: docker/login-action@v3
                                with:
                                          username: ${{ secrets.DOCKERHUB_USERNAME }}
                                          password: ${{ secrets.DOCKERHUB_TOKEN }}

                              - name: Metadata GHCR
                                id: meta_ghcr
                                uses: docker/metadata-action@v5
                                with:
                                          images: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}
                                          tags: |
                                                    type=ref,event=branch
                                                    type=ref,event=tag
                                                    type=sha,prefix=sha-
                                                    type=raw,value=latest,enable={{is_default_branch}}

                              - name: Metadata Docker Hub
                                id: meta_dockerhub
                                if: secrets.DOCKERHUB_USERNAME != ''
                                uses: docker/metadata-action@v5
                                with:
                                          images: ${{ env.DOCKERHUB_IMAGE }}
                                          tags: |
                                                    type=ref,event=branch
                                                    type=ref,event=tag
                                                    type=sha,prefix=sha-
                                                    type=raw,value=latest,enable={{is_default_branch}}

                              - name: Build and push
                                uses: docker/build-push-action@v6
                                with:
                                          context: .
                                          push: ${{ github.event_name != 'pull_request' }}
                                          tags: |
                                                    ${{ steps.meta_ghcr.outputs.tags }}
                                                    ${{ steps.meta_dockerhub.outputs.tags }}
                                          labels: ${{ steps.meta_ghcr.outputs.labels }}
                                          cache-from: type=gha
                                          cache-to: type=gha,mode=max
