version: 2

updates:
          # Python dependencies in requirements.txt
          - package-ecosystem: "pip"
            directory: "/app"
            schedule:
                      interval: "weekly"
                      day: "monday"
                      time: "03:00"
            open-pull-requests-limit: 5
            commit-message:
                      prefix: "chore: "
                      include: "scope"
            reviewers:
                      - "" # Add your GitHub username here
            labels:
                      - "dependencies"
                      - "python"
            allow:
                      - dependency-type: "all"
            ignore:
                      # Add any packages to ignore version updates here
                      - dependency-name: "python"

          # GitHub Actions
          - package-ecosystem: "github-actions"
            directory: "/"
            schedule:
                      interval: "weekly"
                      day: "monday"
                      time: "04:00"
            open-pull-requests-limit: 5
            commit-message:
                      prefix: "ci: "
            labels:
                      - "dependencies"
                      - "github-actions"

          # Docker image updates
          - package-ecosystem: "docker"
            directory: "/"
            schedule:
                      interval: "weekly"
                      day: "monday"
                      time: "02:00"
            open-pull-requests-limit: 2
            commit-message:
                      prefix: "build: "
            labels:
                      - "dependencies"
                      - "docker"
