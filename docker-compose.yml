version: "3.9"

services:
          telegram-bot:
                    build:
                              context: .
                              dockerfile: Dockerfile
                    container_name: rag-telegram-bot
                    env_file:
                              - .env.bot
                    environment:
                              TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
                              RAG_API_URL: ${RAG_API_URL:-http://rag-api:8000/api/v1}
                              RAG_API_KEY: ${RAG_API_KEY}
                              APPWRITE_API_KEY: ${APPWRITE_API_KEY}
                              LOG_LEVEL: ${LOG_LEVEL:-INFO}
                    restart: on-failure:5
                    networks:
                              - rag-network
                    depends_on:
                              - rag-api
                    logging:
                              driver: "json-file"
                              options:
                                        max-size: "10m"
                                        max-file: "3"

          # Optional: Include RAG API service for local testing
          rag-api:
                    build:
                              context: ./app
                              dockerfile: Dockerfile.api # Create this if you want to include RAG API
                    container_name: rag-api
                    ports:
                              - "8000:8000"
                    env_file:
                              - .env
                    environment:
                              APP_ENV: ${APP_ENV:-development}
                              MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
                    restart: on-failure:5
                    networks:
                              - rag-network
                    depends_on:
                              - mongo
                    logging:
                              driver: "json-file"
                              options:
                                        max-size: "10m"
                                        max-file: "3"

          mongo:
                    image: mongo:7.0
                    container_name: rag-mongo
                    ports:
                              - "27017:27017"
                    environment:
                              MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
                              MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
                    volumes:
                              - mongo-data:/data/db
                    networks:
                              - rag-network
                    restart: on-failure:5

networks:
          rag-network:
                    driver: bridge

volumes:
          mongo-data:
                    driver: local
